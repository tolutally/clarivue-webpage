<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Redirecting to FAQ | Clarivue</title>
    <meta name="description" content="Support page redirecting to our comprehensive FAQ section for Clarivue interview software.">
    
    <!-- Canonical redirect -->
    <link rel="canonical" href="https://clarivue.io/faq.html">
    
    <!-- Immediate redirect -->
    <meta http-equiv="refresh" content="0; url=/faq.html">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon-clarivue/favicon.ico">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #102C65, #1a3875);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        
        .logo {
            margin-bottom: 2rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        p {
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }
        
        .manual-link {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .manual-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/clarivue-icon.png" alt="Clarivue" width="60" height="60" style="opacity: 0.9;">
        </div>
        
        <div class="spinner"></div>
        
        <h1>Redirecting to Support</h1>
        <p>You're being redirected to our FAQ page where you can find answers to common questions.</p>
        
        <a href="/faq.html" class="manual-link">Go to FAQ →</a>
    </div>

    <script>
        // JavaScript redirect as backup
        setTimeout(function() {
            window.location.href = '/faq.html';
        }, 100);
        
        // Handle cases where user clicks back button
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.href = '/faq.html';
            }
        });
    </script>
</body>
</html>
